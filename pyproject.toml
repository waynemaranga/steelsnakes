[project]
name = "steelsnakes"
version = "0.0.1-alpha-11"
description = "A python library for structural steel."
readme = { file = "README.md", content-type = "text/markdown" }
license = "GPL-2.0 " # https://packaging.python.org/en/latest/glossary/#term-SPDX-Expression
license-files = ["LICENSE.md"]
authors = [{ name = "Wayne Maranga", email = "waynemaranga@gmail.com" }]
requires-python = ">=3.14"

dependencies = [
    "coverage==7.10.0",
    "matplotlib>=3.10.8",
    "numpy>=2.3.2",
    "plotly>=6.0.0",
    "pydantic>=2.11.7",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "sectionproperties>=3.10.2",
    "shibuya>=2026.7.12",
    "sphinx>=9.0.4",
    "myst-parser>=4.0.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.6.1",
    "sphinxcontrib-mermaid>=1.0.0",
    "sqlalchemy>=2.0.43",
    "sphinx-tabs>=3.5.0",
    "sphinx-togglebutton>=0.4.5",
    "jupyter-sphinx>=0.5.3",
    "nbsphinx>=0.9.8",
    "numpydoc>=1.11.0",
    "sphinx-docsearch>=0.3.1",
    "sphinx-click>=6.2.0",
    "click-extra>=9.3.4",
    "sphinx-contributors>=0.3.0",
    "sphinx-autoapi>=3.8.1",
    "sphinx-iconify>=0.3.0",
    "sphinx-datatables>=1.0.0",
]

# [project.optional-dependencies]
# extras = [
#     # Extra features:
#     # - ui using streamlit and/or fastapi with LateX rendering (https://fastapi.tiangolo.com/advanced/latex/)
#     # - cli using typer/click/argparse, maybe even a tui
#     # - built-in sqlite with fastapi's sqlmodels (from tiangolo: https://sqlmodel.tiangolo.com/tutorial/)
#     # - probably: sqlite binary: pysqlite3-binary - since in advanced implementations, the speed of sqlite matters
#     # - TODO: switch to sqlite for engineering calcs/lookups/ etc...

# ]
# dev = [
#     # Standard package + extras
#     # "steelsnakes[extras]", # ... only if extras has been implemented, otherwise no.
#     # ...plus...
#     # - testing: pytest, pytest-cov, coverage
#     # - documentation: sphinx, shibuya, myst-parser, sphinx-design, sphinxcontrib-mermaid
# ]


[project.scripts]
steelsnakes = "steelsnakes.main:main"
# steelsnakes-db = "steelsnakes.cli:main" # TODO: maybe later

[project.urls]
homepage = "https://github.com/waynemaranga/steelsnakes"
issues = "https://github.com/waynemaranga/steelsnakes/issues"
documentation = "https://steelsnakes.readthedocs.io/en/latest/"
discussions = "https://github.com/waynemaranga/steelsnakes/discussions"

# classifiers = [
#     "Programming Language :: Python :: 3",
#     "Operating System :: OS Independent",
# ]

[build-system]
requires = ["uv_build>=0.8.6,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
ignore = [
    "F401", # Module imported but unused
    "F841", # Local variable name is assigned to but never used
    "E741", # Ambiguous variable name 'l'
    # "E742",  # Ambiguous class name 'l'
    # "E743"   # Ambiguous function name 'l'
]

[dependency-groups]
dev = [
    "sphinx-autobuild>=2025.8.25",
]
