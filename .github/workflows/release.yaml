# Creates a GitHub release, with the wheel and sdist attached, when a version tag is pushed:
#   git tag v0.0.1-alpha-12 && git push origin v0.0.1-alpha-12
# The tag must match the pyproject.toml version; alpha/beta/rc versions are marked as pre-releases.
# Release notes are the matching "## <version>" section of CHANGELOG.md, followed by GitHub's generated notes.
# Running it by hand (Actions > Release > Run workflow) is a dry run: test, build and smoke test, no release.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10

      - name: Check tag matches pyproject.toml version, extract release notes
        id: version
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          uv run --no-project --with packaging python - <<'EOF'
          import os
          import tomllib
          from packaging.version import InvalidVersion, Version

          with open("pyproject.toml", "rb") as f:
              version = Version(tomllib.load(f)["project"]["version"])

          tag = os.environ["TAG"]
          if tag and Version(tag.removeprefix("v")) != version:
              raise SystemExit(f"Tag {tag} does not match pyproject.toml version {version}")

          notes = []
          capture = False
          with open("CHANGELOG.md", encoding="utf-8") as f:
              for line in f:
                  if line.startswith("## "):
                      try:
                          capture = Version(line[3:].split()[0]) == version
                      except InvalidVersion:
                          capture = False
                  elif capture:
                      notes.append(line)

          with open("release-notes.md", "w", encoding="utf-8") as f:
              f.write("".join(notes).strip() + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"prerelease={str(version.is_prerelease).lower()}\n")
          print(f"Version {version}, pre-release: {version.is_prerelease}, CHANGELOG lines: {len(notes)}")
          EOF

      - name: Run tests
        run: uv run --locked pytest

      - name: Build release distributions
        run: uv build

      - name: Smoke test the wheel
        run: uv run --isolated --no-project --with ./dist/*.whl steelsnakes

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-dists
          path: |
            dist/
            release-notes.md

  github-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      contents: write # create the release and upload assets

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v8
        with:
          name: release-dists

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.release-build.outputs.prerelease }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
              --notes-file release-notes.md --generate-notes --prerelease="$PRERELEASE"
          fi
