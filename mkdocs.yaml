# mkdocs: https://www.mkdocs.org/user-guide/configuration/
# Material for MkDocs: https://squidfunk.github.io/mkdocs-material/
# mkdocstrings: https://mkdocstrings.github.io/usage/


site_name: steelsnakes
site_description: A Python library for structural steel.
site_author: Wayne Maranga
site_url: https://steelsnakes.readthedocs.io/en/latest/

repo_name: steelsnakes
repo_url: https://github.com/waynemaranga/steelsnakes
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2026 Wayne Maranga

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: switch to dark mode
    - scheme: slate
      primary: blue
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: switch to light mode

  font:
    text: Bricolage Grotesque
    code: Cascadia Mono

  icon:
    repo: fontawesome/brands/github
  # language: en
  
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.tabs.link
    - toc.follow
    - toc.integrate


plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            members_order: source
            show_source: true
            show_root_heading: true
            show_root_toc_entry: false
            merge_init_into_class: true
            docstring_options:
              ignore_init_summary: true
            filters: ["!^_"]
            heading_level: 1
  # - mike: # FIXME: One day review this and fix...
  #     # https://github.com/jimporter/mike?tab=readme-ov-file#usage
  #     alias_type: symlink
  #     version_selector: true

  - autorefs


markdown_extensions:
  admonition:
  attr_list:
  md_in_html:
  fenced_code:
  footnotes:
  extra:
  pymdownx.details:
  pymdownx.highlight:
    anchor_linenums: true
    line_spans: __span
    pygments_lang_class: true
  pymdownx.inlinehilite:
  pymdownx.tabbed:
    alternate_style: true
  pymdownx.blocks.tab:
    combine_header_slug: true
    separator: ___
  pymdownx.snippets:
  pymdownx.arithmatex:
    generic: true
  toc:
    permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/waynemaranga/steelsnakes
    - icon: fontawesome/brands/python  
      link: https://pypi.org/project/steelsnakes/
    - icon: fontawesome/solid/envelope
      link: mailto:wayne.maranga@gmail.com
  


extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Guides:
    - Overview: 01-guides/index.md
    - First Steps: 01-guides/01-first-steps.md
    - Engineering Workflow: 01-guides/02-engineering-workflow.md
    - Codes and Standards: 01-guides/03-codesandstds.md
    - Classification Architecture Decision: 01-guides/04-classification-architecture-decision.md
    - EU Classification: 01-guides/05-eu-classification.md
  - API Reference:
    - Overview: 02-api-reference/index.md
    - Section Database & Factory: 02-api-reference/02-database.md
    - UK Classification: 02-api-reference/04-uk-classification.md
    - US Classification: 02-api-reference/03-us-classification.md
    - US Member Checks: 02-api-reference/05-us-member-checks.md
    - EU Member Checks: 02-api-reference/07-eu-member-checks.md
    - EU Serviceability Checks: 02-api-reference/08-eu-serviceability-checks.md
    - BS 5950 Classification: 02-api-reference/06-bs-classification.md
    - BS 5950 Member Checks: 02-api-reference/09-bs-member-checks.md
  - References: 99-references.md
